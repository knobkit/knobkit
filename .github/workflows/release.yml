name: Release

# Publishes all packages to npm in lockstep when a `knobkit@X` tag is pushed.
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. Each package has its own
# trusted-publisher entry on npmjs.com pointing at this workflow file.
# Note: we publish with the npm CLI, not `pnpm publish` — pnpm 11 has an OIDC
# regression (pnpm#11513). npm doesn't understand the `workspace:*` protocol,
# so packages that use it are packed with `pnpm pack` (which rewrites it to the
# real version) and npm publishes the tarball. pnpm still does install + build.
on:
  push:
    tags: ['knobkit@*']

permissions:
  id-token: write # mints the OIDC token that authenticates the publish
  contents: write # create the GitHub Release at the end

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile --filter knobkit...
      # The tag is the source of truth for the release; assert package.json agrees
      # so a forgotten version bump fails loud here instead of shipping the wrong
      # version (or a confusing duplicate-version error) from npm.
      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#knobkit@}"
          for pkg in core knobkit create-knobkit; do
            pkg_version="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies $tag_version but packages/$pkg is $pkg_version"
              exit 1
            fi
          done
      # A tag push does not run ci.yml (that's branch/PR-triggered), so gate the
      # publish on the same checks here rather than trusting the tagged commit
      # already went green on main.
      # Core first: knobkit's typecheck/build resolve @knobkit/core from its dist.
      - run: pnpm -F @knobkit/core build
      - run: pnpm -F @knobkit/core typecheck
      - run: pnpm -F @knobkit/core test
      - run: pnpm -F knobkit typecheck
      - run: pnpm -F knobkit test
      # Build up front so a broken build fails the job before any publish, rather
      # than mid-way through `prepublishOnly` with one package already pushed.
      - run: pnpm -F knobkit build
      # Publish order matters: core before knobkit, so a half-failed release can
      # never leave a knobkit on npm whose core dependency doesn't exist yet.
      # Each publish is skipped if the version is already on npm, so re-running a
      # failed release (or pre-seeding a first publish manually) is safe.
      - name: Publish @knobkit/core
        working-directory: packages/core
        run: |
          v="${GITHUB_REF_NAME#knobkit@}"
          if [ -n "$(npm view "@knobkit/core@$v" version 2>/dev/null || true)" ]; then
            echo "@knobkit/core@$v already on npm — skipping"; exit 0
          fi
          pnpm pack
          npm publish knobkit-core-*.tgz --access public
      - name: Publish knobkit
        working-directory: packages/knobkit
        run: |
          v="${GITHUB_REF_NAME#knobkit@}"
          if [ -n "$(npm view "knobkit@$v" version 2>/dev/null || true)" ]; then
            echo "knobkit@$v already on npm — skipping"; exit 0
          fi
          pnpm pack
          npm publish knobkit-[0-9]*.tgz --access public
      - name: Publish create-knobkit
        working-directory: packages/create-knobkit
        run: |
          v="${GITHUB_REF_NAME#knobkit@}"
          if [ -n "$(npm view "create-knobkit@$v" version 2>/dev/null || true)" ]; then
            echo "create-knobkit@$v already on npm — skipping"; exit 0
          fi
          npm publish --access public
      # Surface the tag's own annotation (our changelog) on the Releases page.
      # Runs only after all publishes succeed, so a Release always means npm shipped.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag
